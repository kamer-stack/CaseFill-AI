services:
  - type: web
    name: casefill-ai
    runtime: python
    buildCommand: bash build.sh
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false  # You'll set this manually in the Render dashboard
      - key: BASE_URL
        sync: false  # You'll set this manually in the Render dashboard
    plan: free
